name: Android API integration

on:
  pull_request:
    paths:
      - 'TCC/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: TCC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Unit tests, debug APK, instrumentation compilation, lint
        run: bash gradlew --no-daemon --max-workers=2 testDebugUnitTest assembleDebug compileDebugAndroidTestKotlin lintDebug
      - name: Unit test count
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          results = [ET.parse(p).getroot() for p in pathlib.Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          print('Tests:', sum(int(r.get('tests', 0)) for r in results))
          print('Failures:', sum(int(r.get('failures', 0)) + int(r.get('errors', 0)) for r in results))
          PY
