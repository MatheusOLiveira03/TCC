name: Android API integration

on:
  pull_request:
    paths:
      - 'TCC/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: TCC
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android command line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Unit tests, debug APK, instrumentation compilation, lint
        run: bash gradlew --no-daemon --max-workers=2 testDebugUnitTest assembleDebug compileDebugAndroidTestKotlin lintDebug
      - name: Unit test count
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          results = [ET.parse(p).getroot() for p in pathlib.Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          print('Tests:', sum(int(r.get('tests', 0)) for r in results))
          print('Failures:', sum(int(r.get('failures', 0)) + int(r.get('errors', 0)) for r in results))
          PY
